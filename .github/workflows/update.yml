name: Collect and publish Teaz counter
on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '17,37 22 * * *'
    - cron: '7 23 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '오늘 기록을 새로 수집하여 교체'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/**', '.github/workflows/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: teaz-update-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test collector
        run: node --test tests/*.test.mjs
      - name: Collect public message counts
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then node scripts/collect.mjs --force; else node scripts/collect.mjs; fi
      - name: Save daily history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: save daily Teaz message counters'
            git push origin main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
