name: One-time midnight update 2026-10-20 KST
on:
  schedule:
    - cron: '0,17,37 15 19 10 *'
  workflow_dispatch:
permissions:
  actions: write
  contents: write
  pages: write
  id-token: write
concurrency:
  group: teaz-update-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check one-time target date
        run: test "$(TZ=Asia/Seoul date +%F)" = "2026-10-20"
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test collector
        run: node --test tests/*.test.mjs
      - name: Capture midnight counters once
        run: |
          node --input-type=module -e "import fs from 'node:fs';import {collect,kstDate} from './scripts/collect.mjs';const h=JSON.parse(fs.readFileSync('docs/data/history.json'));if(!h.some(s=>s.date===kstDate(new Date()))){process.argv.push('--force');await collect()}else{console.log('Midnight snapshot already captured')}"
      - name: Save daily history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: save daily Teaz message counters'
            git push origin main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Disable completed one-time schedule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e "const r=await fetch('https://api.github.com/repos/kjysss2/teaz/actions/workflows/midnight-once.yml/disable',{method:'PUT',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('Disable schedule HTTP '+r.status)"
